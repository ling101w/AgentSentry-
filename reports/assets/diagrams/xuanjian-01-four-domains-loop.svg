    <text x="92" y="86" fill="#ffffff" font-size="48" font-weight="950" text-anchor="start" class="">
<tspan x="92" dy="0">玄鉴：四域一环总体架构</tspan>
</text>
    <text x="94" y="132" fill="#9bcfe4" font-size="25" font-weight="550" text-anchor="start" class="">
<tspan x="94" dy="0">面向 OpenClaw 工具调用链的实时行为监督与风险拦截系统</tspan>
</text>
    
