</text>
      <text x="1418" y="316" fill="#b9d6e6" font-size="24" font-weight="500" text-anchor="start" class="">
<tspan x="1418" dy="0">MEMORY.md、openclaw.json、</tspan>
<tspan x="1418" dy="34">Skill、启动项等持久化状态进入</tspan>
<tspan x="1418" dy="34">护照、哈希、隔离与回滚检查。</tspan>
</text>
