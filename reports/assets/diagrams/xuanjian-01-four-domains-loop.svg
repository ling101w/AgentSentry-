</text>
      <text x="168" y="316" fill="#b9d6e6" font-size="24" font-weight="500" text-anchor="start" class="">
<tspan x="168" dy="0">外部网页、邮件、PDF、图像、工</tspan>
<tspan x="168" dy="34">具返回统一打来源标签；隐藏文本</tspan>
<tspan x="168" dy="34">只允许被总结，不能驱动高危动作</tspan>
<tspan x="168" dy="34">。</tspan>
</text>
    </g>
    
