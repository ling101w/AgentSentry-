<tspan x="168" dy="0">由用户请求生成 TaskSpec，结合</tspan>
<tspan x="168" dy="34"> ABAC 检查工具、目标、收件人</tspan>
<tspan x="168" dy="34">和路径是否仍在授权范围。</tspan>
</text>
